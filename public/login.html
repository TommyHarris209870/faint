<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Moderator Login - Rotten</title>

</head>

<body>

    <h1>Rotten Moderator Login</h1>


    <form id="login-form">

        <label>
            Username
        </label>

        <input
            id="username"
            type="text"
            required
        >


        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="login-error"></p>


    <script src="/login.js"></script>

</body>

</html>
